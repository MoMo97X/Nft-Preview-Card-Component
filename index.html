<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | NFT preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
   <link rel="stylesheet" href="css/main.css">
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; color: var(--White); position: relative; top: 2rem;}
    .attribution a { color: var(--Cyan-400); font-size: var(--fs-span); font-family: "outfit",Arial, Helvetica, sans-serif; &:hover{color:var(--Blue-500);}}
  </style>
</head>
<body>

  <main class="card">
    <!-- 1 -->
    <section class="card-img">
      <img class="img" src="images/image-equilibrium.jpg" alt="rotate cubic">
    </section>
    <!-- 2 -->
    <section class="card-body">
    <h1 class="card-title">Equilibrium #3429</h1>
    <p class="card-description">Our Equilibrium collection promotes balance and calm.</p>
    <div class="card-stats">
      <!-- 1 -->
      <div>
        <img src="images/icon-ethereum.svg" alt="">
        <span class="stat ethereum">0.041 ETH</span>
      </div>
      <!-- 2 -->
      <div>
        <img src="images/icon-clock.svg" alt="">
        <span class="stat clock">3 days left</span>
      </div>
    </div>
    <div class="card-bio">
      <img class="card-avatar" src="images/image-avatar.png" alt="Jules Wyvern">
      <p class="avatar-name">Creation of <span>Jules Wyvern</span> </p>
    </div>
    </section>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Muhammed Arrujbani</a>.
  </footer>
</body>
</html>
